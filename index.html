<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generate 1.1</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas for exporting the image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Asap+Sharp:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:wght@400;700&family=Rubik:wght@400;500;700&family=Lora:wght@400;500;700&family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-geist { font-family: 'Geist', sans-serif; }
        .font-asap-sharp { font-family: 'Asap Sharp', sans-serif; }
        .font-noto-sans { font-family: 'Noto Sans', sans-serif; }
        .font-dm-sans { font-family: 'DM Sans', sans-serif; }
        .font-libre-baskerville { font-family: 'Libre Baskerville', serif; }
        .font-rubik { font-family: 'Rubik', sans-serif; }
        .font-lora { font-family: 'Lora', serif; }
        .font-arimo { font-family: 'Arimo', sans-serif; }
        #canvas-wrapper {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            position: relative;
            margin: 0 auto;
            transition: aspect-ratio 0.3s ease;
        }
        #export-area {
            transition: background-color 0.3s, color 0.3s, background-image 0.3s;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }
        [contenteditable]:focus {
            outline: none;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.5);
        }
        
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            opacity: 0.5;
        }
        input[type=range] {
            accent-color: #2563eb;
        }
        
        .align-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* Gradient presets */
        .grad-1 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .grad-2 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .grad-3 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .grad-4 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
        .grad-5 { background: linear-gradient(135deg, #29323c 0%, #485563 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-inter">
    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Controls Sidebar -->
        <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit space-y-6">
            <div>
                <h1 class="text-2xl font-bold mb-1 tracking-tight">Quote Builder</h1>
                <p class="text-xs text-gray-500">Design and export your quotes with advanced options.</p>
            </div>
            <!-- Background Theme -->
            <div>
                <label class="block text-sm font-semibold mb-2">Background</label>
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button onclick="setBackground('dark')" id="btn-dark" class="py-2 bg-gray-900 text-white rounded-md text-sm border border-gray-900 transition-colors">Dark</button>
                    <button onclick="setBackground('light')" id="btn-light" class="py-2 bg-white text-gray-900 rounded-md text-sm border border-gray-300 transition-colors">Light</button>
                    <button onclick="setBackground('transparent')" id="btn-trans" class="py-2 bg-gray-100 text-gray-900 rounded-md text-sm border border-gray-200 transition-colors">Clear</button>
                </div>
                <div class="flex gap-2 mt-2">
                    <button onclick="setGradient('grad-1')" class="w-8 h-8 rounded-full grad-1 ring-2 ring-offset-1 ring-transparent hover:ring-gray-400 transition-all" title="Sunset"></button>
                    <button onclick="setGradient('grad-2')" class="w-8 h-8 rounded-full grad-2 ring-2 ring-offset-1 ring-transparent hover:ring-gray-400 transition-all" title="Mint"></button>
                    <button onclick="setGradient('grad-3')" class="w-8 h-8 rounded-full grad-3 ring-2 ring-offset-1 ring-transparent hover:ring-gray-400 transition-all" title="Lavender"></button>
                    <button onclick="setGradient('grad-4')" class="w-8 h-8 rounded-full grad-4 ring-2 ring-offset-1 ring-transparent hover:ring-gray-400 transition-all" title="Rose"></button>
                    <button onclick="setGradient('grad-5')" class="w-8 h-8 rounded-full grad-5 ring-2 ring-offset-1 ring-transparent hover:ring-gray-400 transition-all" title="Midnight"></button>
                </div>
            </div>
            <!-- Text Color -->
            <div>
                <label class="block text-sm font-semibold mb-2">Text Color</label>
                <div class="flex gap-2">
                    <button onclick="setTextColor('text-white')" class="flex-1 py-1.5 bg-gray-800 text-white rounded-md text-sm border border-gray-800">White</button>
                    <button onclick="setTextColor('text-black')" class="flex-1 py-1.5 bg-white text-black rounded-md text-sm border border-gray-300">Black</button>
                    <input type="color" id="custom-text-color" class="w-8 h-8 rounded cursor-pointer border-0 p-0" oninput="setCustomTextColor(this.value)" title="Custom Color">
                </div>
            </div>
            
            <!-- Canvas Size (Ratio) Selector -->
            <div>
                <label class="block text-sm font-semibold mb-2">Canvas Ratio</label>
                <div class="flex flex-wrap gap-2">
                    <button onclick="setRatio('1/1')" class="flex-1 min-w-[50px] py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-md text-sm font-medium">1:1</button>
                    <button onclick="setRatio('4/5')" class="flex-1 min-w-[50px] py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-md text-sm font-medium">4:5</button>
                    <button onclick="setRatio('9/16')" class="flex-1 min-w-[50px] py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-md text-sm font-medium">9:16</button>
                    <button onclick="setRatio('3/2')" class="flex-1 min-w-[50px] py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-md text-sm font-medium">3:2</button>
                </div>
            </div>
            <!-- Font Selector -->
            <div>
                <label class="block text-sm font-semibold mb-2">Typography</label>
                <select id="font-select" onchange="updateFont()" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="font-inter">Inter</option>
                    <option value="font-jakarta">Plus Jakarta Sans</option>
                    <option value="font-playfair">Playfair Display</option>
                    <option value="font-poppins">Poppins</option>
                    <option value="font-geist">Geist</option>
                    <option value="font-asap-sharp">Asap Sharp</option>
                    <option value="font-noto-sans">Noto Sans</option>
                    <option value="font-dm-sans">DM Sans</option>
                    <option value="font-libre-baskerville">Libre Baskerville</option>
                    <option value="font-rubik">Rubik</option>
                    <option value="font-lora">Lora</option>
                    <option value="font-arimo">Arimo</option>
                </select>
            </div>
            
            <!-- Adjustments -->
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between">
                        <label class="block text-sm font-semibold mb-2">Font Size</label>
                        <span id="font-size-val" class="text-xs text-gray-500">24px</span>
                    </div>
                    <input type="range" min="16" max="96" value="24" class="w-full cursor-pointer" oninput="updateFontSize(this.value)">
                </div>
                <div>
                    <div class="flex justify-between">
                        <label class="block text-sm font-semibold mb-2">Line Height</label>
                        <span id="line-height-val" class="text-xs text-gray-500">1.5</span>
                    </div>
                    <input type="range" min="1.0" max="2.5" step="0.1" value="1.5" class="w-full cursor-pointer" oninput="updateLineHeight(this.value)">
                </div>
            </div>
            <!-- Formatting & Alignment -->
            <div>
                <label class="block text-sm font-semibold mb-2">Formatting</label>
                <div class="flex gap-2">
                    <button onclick="toggleFormat('font-bold')" class="w-10 h-10 bg-gray-50 hover:bg-gray-200 rounded-md font-serif font-bold border border-gray-200" title="Bold">B</button>
                    <button onclick="toggleFormat('italic')" class="w-10 h-10 bg-gray-50 hover:bg-gray-200 rounded-md font-serif italic border border-gray-200" title="Italic">I</button>
                    <div class="w-px bg-gray-200 mx-1"></div>
                    <button onclick="setAlignment('text-left')" class="flex-1 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md flex justify-center items-center" title="Align Left">
                        <svg class="align-icon" viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line></svg>
                    </button>
                    <button onclick="setAlignment('text-center')" class="flex-1 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md flex justify-center items-center" title="Align Center">
                        <svg class="align-icon" viewBox="0 0 24 24"><line x1="18" y1="10" x2="6" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line></svg>
                    </button>
                    <button onclick="setAlignment('text-right')" class="flex-1 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md flex justify-center items-center" title="Align Right">
                        <svg class="align-icon" viewBox="0 0 24 24"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line></svg>
                    </button>
                </div>
            </div>
            <!-- Padding Selector -->
            <div>
                <label class="block text-sm font-semibold mb-2">Padding</label>
                <div class="flex gap-2">
                    <button onclick="setPadding('p-8')" class="flex-1 py-1.5 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md text-sm">S</button>
                    <button onclick="setPadding('p-12')" class="flex-1 py-1.5 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md text-sm">M</button>
                    <button onclick="setPadding('p-16')" class="flex-1 py-1.5 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md text-sm">L</button>
                    <button onclick="setPadding('p-24')" class="flex-1 py-1.5 bg-gray-50 hover:bg-gray-200 border border-gray-200 rounded-md text-sm">XL</button>
                </div>
            </div>
            
            <!-- Toggles -->
            <div class="space-y-2">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="divider-toggle" onchange="toggleDivider()" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="text-sm font-medium">Show Dotted Divider</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="shadow-toggle" onchange="toggleShadow()" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="text-sm font-medium">Add Text Drop Shadow</span>
                </label>
            </div>
            <hr class="border-gray-100">
            <!-- Download Button -->
            <div>
                <button onclick="downloadImage()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
                    Export High-Res PNG
                </button>
            </div>
        </div>
        <!-- Canvas Area -->
        <div class="lg:col-span-3 flex flex-col items-center justify-center bg-gray-100 rounded-2xl p-4 sm:p-8 border border-gray-200 shadow-inner overflow-hidden">
            
            <div id="canvas-wrapper" class="bg-white shadow-2xl rounded-sm overflow-hidden ring-1 ring-black/5">
                <!-- The actual area that gets exported -->
                <div id="export-area" class="bg-black text-white p-16 flex flex-col justify-center relative">
                    
                    <!-- Post Header -->
                    <div class="flex items-center space-x-4 mb-6 z-10">
                        <img src="https://unavatar.io/x/shressh" crossorigin="anonymous" alt="Profile picture" class="w-14 h-14 rounded-full object-cover bg-gray-800 shadow-sm border-2 border-white/10">
                        <div class="flex flex-col">
                            <span class="font-bold text-lg leading-tight tracking-tight" contenteditable="true" data-placeholder="Name">Mahesh S</span>
                            <span class="text-sm opacity-70 font-medium" contenteditable="true" data-placeholder="Handle">@shressh</span>
                        </div>
                    </div>
                    <!-- Quote Content with Dotted Line -->
                    <div class="flex flex-col z-10 relative">
                        <div id="quote-text" class="font-inter text-left outline-none transition-all duration-200" style="font-size: 24px; line-height: 1.5;" contenteditable="true" data-placeholder="Write your quote here...">The only way to do great work is to love what you do.</div>
                        <div id="divider-container" class="w-full mt-8">
                            <hr id="quote-divider" class="border-t-[1px] border-dotted border-current opacity-30 w-full transition-opacity">
                            <div class="text-[12px] font-inter opacity-40 font-light tracking-wide mt-2">© D&B People</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <p class="text-xs text-gray-400 mt-6 flex items-center gap-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                Tip: You can edit any text directly by clicking on it.
            </p>
        </div>
    </div>
    <script>
        const exportArea = document.getElementById('export-area');
        const quoteText = document.getElementById('quote-text');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const quoteDivider = document.getElementById('quote-divider');
        
        // --- Aspect Ratio Logic ---
        function setRatio(ratio) {
            canvasWrapper.style.aspectRatio = ratio;
        }
        // --- Background Logic ---
        function setBackground(theme) {
            exportArea.className = exportArea.className.replace(/grad-\d+/g, '').trim();
            exportArea.style.background = '';
            
            if (theme === 'dark') {
                exportArea.classList.remove('bg-[#f8f9fa]', 'bg-transparent');
                exportArea.classList.add('bg-black');
                setTextColor('text-white');
            } else if (theme === 'light') {
                exportArea.classList.remove('bg-black', 'bg-transparent');
                exportArea.classList.add('bg-[#f8f9fa]');
                setTextColor('text-black');
            } else if (theme === 'transparent') {
                exportArea.classList.remove('bg-black', 'bg-[#f8f9fa]');
                exportArea.classList.add('bg-transparent');
            }
        }
        
        function setGradient(gradClass) {
            exportArea.classList.remove('bg-black', 'bg-[#f8f9fa]', 'bg-transparent');
            exportArea.className = exportArea.className.replace(/grad-\d+/g, '').trim();
            exportArea.classList.add(gradClass);
            exportArea.style.background = '';
            setTextColor('text-white');
        }
        // --- Text Color Logic ---
        function setTextColor(colorClass) {
            exportArea.classList.remove('text-white', 'text-black');
            exportArea.style.color = ''; 
            if (colorClass) {
                exportArea.classList.add(colorClass);
            }
        }
        
        function setCustomTextColor(hex) {
            exportArea.classList.remove('text-white', 'text-black');
            exportArea.style.color = hex;
        }
        // --- Font Adjustments Logic ---
        function updateFontSize(val) {
            quoteText.style.fontSize = val + 'px';
            document.getElementById('font-size-val').innerText = val + 'px';
        }
        
        function updateLineHeight(val) {
            quoteText.style.lineHeight = val;
            document.getElementById('line-height-val').innerText = val;
        }
        // --- Typography Logic ---
        function updateFont() {
            const fontClass = document.getElementById('font-select').value;
            
            const classesToRemove = [];
            quoteText.classList.forEach(cls => {
                if (cls.startsWith('font-') && cls !== 'font-bold') {
                    classesToRemove.push(cls);
                }
            });
            classesToRemove.forEach(cls => quoteText.classList.remove(cls));
            
            quoteText.classList.add(fontClass);
        }
        function toggleFormat(formatClass) {
            quoteText.classList.toggle(formatClass);
        }
        // --- Alignment Logic ---
        function setAlignment(alignClass) {
            quoteText.classList.remove('text-left', 'text-center', 'text-right');
            quoteText.classList.add(alignClass);
        }
        // --- Padding Logic ---
        function setPadding(paddingClass) {
            exportArea.classList.remove('p-8', 'p-12', 'p-16', 'p-24');
            exportArea.classList.add(paddingClass);
        }
        
        // --- Toggles ---
        function toggleDivider() {
            const isChecked = document.getElementById('divider-toggle').checked;
            document.getElementById('divider-container').style.display = isChecked ? 'block' : 'none';
        }
        
        function toggleShadow() {
            const isChecked = document.getElementById('shadow-toggle').checked;
            if (isChecked) {
                quoteText.style.textShadow = '0px 4px 12px rgba(0,0,0,0.3)';
            } else {
                quoteText.style.textShadow = 'none';
            }
        }
        // --- Export Logic ---
        async function downloadImage() {
            if (document.activeElement instanceof HTMLElement) {
                document.activeElement.blur();
            }
            
            await new Promise(resolve => setTimeout(resolve, 150));
            let bgOpt = null;
            if (exportArea.classList.contains('bg-transparent')) {
                bgOpt = null;
            }
            html2canvas(exportArea, {
                scale: 3, 
                useCORS: true,
                backgroundColor: bgOpt,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `quote-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
